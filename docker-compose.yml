services:
  mlflow:
    build: .
    command: ["mlflow", "ui", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "file:///app/mlruns"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./artifacts:/app/artifacts

  app:
    build: .
    command: ["pytest"]
    volumes:
      - ./mlruns:/app/mlruns
      - ./artifacts:/app/artifacts
