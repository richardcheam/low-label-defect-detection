seed: 42

data:
  coco_root: data/sixray_v3_coco   # produced by prepare-detection-data

model:
  variant: nano                    # nano | small | base

output_dir: artifacts/sixray_detection

train:
  epochs: 30
  batch_size: 8                    # per-GPU batch size
  learning_rate: 0.0001
  devices: 1                        # number of GPUs ("auto" = all visible, requires torchrun)
  grad_accum_steps: 1               # effective_batch_size = batch_size * grad_accum_steps * devices
  find_unused_parameters: true       # required by DDP for RF-DETR's auxiliary decoder losses

tracking:
  enabled: true
  experiment: sixray-detection
  tracking_uri: null               # null -> local ./mlruns
